<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIFTY-50 ENVELOPE SCANNER</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0e1a;
            color: #e2e8f0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #ffd966;
            font-size: 1.5rem;
        }
        .controls {
            background: #111827;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .param {
            background: #1e293b;
            padding: 5px 10px;
            border-radius: 6px;
            display: inline-flex;
            gap: 8px;
        }
        input, button {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
        }
        button {
            background: #3b82f6;
            cursor: pointer;
        }
        .status-bar {
            background: #0f172a;
            padding: 8px;
            border-radius: 6px;
            margin: 10px 0;
            font-size: 0.8rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #111827;
            border-radius: 8px;
            margin-top: 15px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #1e293b;
        }
        th {
            background: #0f172a;
        }
        .BUY {
            background: #15803d;
            padding: 4px 8px;
            border-radius: 12px;
            display: inline-block;
        }
        .HOLD {
            background: #4b5563;
            padding: 4px 8px;
            border-radius: 12px;
            display: inline-block;
        }
        .EXIT {
            background: #b91c1c;
            padding: 4px 8px;
            border-radius: 12px;
            display: inline-block;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📈 NIFTY-50 ENVELOPE SCANNER</h1>
    
    <div class="controls">
        <div class="param"><label>Envelope %</label><input type="number" id="envPercent" value="14" step="1"></div>
        <div class="param"><label>Touch %</label><input type="number" id="touchZone" value="1" step="0.5"></div>
        <button id="applyBtn">Apply</button>
        <button id="fetchBtn">Refresh</button>
    </div>

    <div class="status-bar">
        <span>Status: <span id="status">Ready</span></span>
        <span>Last Update: <span id="lastUpdate">Never</span></span>
    </div>

    <div style="overflow-x: auto;">
        <table id="stockTable">
            <thead>
                <tr>
                    <th>SYMBOL</th>
                    <th>LTP (₹)</th>
                    <th>SMA-200</th>
                    <th>LOWER BAND</th>
                    <th>UPPER BAND</th>
                    <th>SIGNAL</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="6" style="text-align:center">Click Refresh to load data</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let liveData = [];
    let activeEnv = 14;
    let activeTouch = 1;
    
    async function fetchData() {
        const statusSpan = document.getElementById('status');
        statusSpan.innerHTML = "Fetching...";
        
        try {
            const response = await fetch('/api/stocks');
            const data = await response.json();
            
            if (data.success && data.data) {
                liveData = data.data;
                statusSpan.innerHTML = `✅ ${liveData.length} stocks`;
                document.getElementById('lastUpdate').innerHTML = new Date().toLocaleTimeString();
                calculateSignals();
            } else {
                statusSpan.innerHTML = "❌ No data";
            }
        } catch(err) {
            statusSpan.innerHTML = "❌ Error: " + err.message;
        }
    }
    
    function calculateSignals() {
        const results = [];
        
        for (let stock of liveData) {
            const ltp = stock.ltp;
            const sma = stock.sma200;
            const lower = sma * (1 - activeEnv/100);
            const upper = sma * (1 + activeEnv/100);
            const touch = (upper - lower) * (activeTouch / 100);
            
            let signal = "HOLD";
            if (ltp <= lower + touch) signal = "BUY";
            else if (ltp >= upper - touch) signal = "EXIT";
            
            results.push({
                symbol: stock.symbol,
                ltp: ltp,
                sma: sma,
                lower: lower,
                upper: upper,
                signal: signal
            });
        }
        
        // Sort BUY first
        results.sort((a, b) => {
            if (a.signal === "BUY") return -1;
            if (b.signal === "BUY") return 1;
            return 0;
        });
        
        renderTable(results);
    }
    
    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6">No data</td></tr>';
            return;
        }
        
        let html = '';
        for (let s of data) {
            html += '<tr>';
            html += '<td><strong>' + s.symbol + '</strong></td>';
            html += '<td>₹' + s.ltp.toFixed(2) + '</td>';
            html += '<td>₹' + s.sma.toFixed(2) + '</td>';
            html += '<td style="color:#86efac">₹' + s.lower.toFixed(2) + '</td>';
            html += '<td style="color:#fca5a5">₹' + s.upper.toFixed(2) + '</td>';
            html += '<td><span class="' + s.signal + '">' + s.signal + '</span></td>';
            html += '</tr>';
        }
        tbody.innerHTML = html;
    }
    
    function applySettings() {
        activeEnv = parseInt(document.getElementById('envPercent').value);
        activeTouch = parseFloat(document.getElementById('touchZone').value);
        if (liveData.length > 0) {
            calculateSignals();
        }
        document.getElementById('status').innerHTML = `Settings applied: ${activeEnv}% / ${activeTouch}%`;
    }
    
    document.getElementById('applyBtn').onclick = applySettings;
    document.getElementById('fetchBtn').onclick = fetchData;
    
    // Load on page open
    fetchData();
</script>
</body>
</html>
