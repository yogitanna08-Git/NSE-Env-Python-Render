<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIFTY-50 ENVELOPE SCANNER</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0a0e1a; color: #e2e8f0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #ffd966; margin-bottom: 10px; }
        .status { background: #1e293b; padding: 10px; border-radius: 8px; margin: 15px 0; display: flex; justify-content: space-between; flex-wrap: wrap; }
        button { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        button:hover { background: #2563eb; }
        table { width: 100%; border-collapse: collapse; background: #111827; border-radius: 8px; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #1e293b; }
        th { background: #0f172a; }
        .BUY { background: #15803d; color: white; padding: 4px 10px; border-radius: 20px; display: inline-block; }
        .EXIT { background: #b91c1c; color: white; padding: 4px 10px; border-radius: 20px; display: inline-block; }
        .HOLD { background: #4b5563; color: white; padding: 4px 10px; border-radius: 20px; display: inline-block; }
        .loading { text-align: center; padding: 40px; }
        .error { color: #fca5a5; text-align: center; padding: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📈 NIFTY-50 ENVELOPE SCANNER</h1>
    <div style="margin-bottom: 15px;">
        <button id="fetchBtn">🔄 Fetch Live Data</button>
    </div>
    
    <div class="status">
        <span>⚙️ Envelope: 14% | Touch: 1%</span>
        <span>🕐 Last Update: <span id="lastUpdate">Never</span></span>
        <span>📡 Status: <span id="apiStatus">Ready</span></span>
    </div>

    <div id="results">
        <div class="loading">Click "Fetch Live Data" to get NSE prices</div>
    </div>
</div>

<script>
    async function fetchStocks() {
        const resultsDiv = document.getElementById('results');
        const statusSpan = document.getElementById('apiStatus');
        const fetchBtn = document.getElementById('fetchBtn');
        
        resultsDiv.innerHTML = '<div class="loading">Loading stock data...</div>';
        statusSpan.innerHTML = "Fetching...";
        fetchBtn.disabled = true;
        
        try {
            const response = await fetch('/api/stocks');
            const data = await response.json();
            
            if (data.success && data.data.length > 0) {
                let html = '<table><thead><tr>';
                html += '<th>SYMBOL</th><th>LTP (₹)</th><th>SMA-200</th><th>LOWER BAND</th><th>UPPER BAND</th><th>SIGNAL</th>';
                html += '</tr></thead><tbody>';
                
                for (let stock of data.data) {
                    html += `<tr>
                        <td><strong>${stock.symbol}</strong></td>
                        <td>₹${stock.ltp}</td>
                        <td>₹${stock.sma200}</td>
                        <td style="color: #86efac;">₹${stock.lower_band}</td>
                        <td style="color: #fca5a5;">₹${stock.upper_band}</td>
                        <td><span class="${stock.signal}">${stock.signal}</span></td>
                    </tr>`;
                }
                
                html += '</tbody></table>';
                resultsDiv.innerHTML = html;
                statusSpan.innerHTML = `✅ ${data.count} stocks loaded`;
                document.getElementById('lastUpdate').innerHTML = new Date().toLocaleTimeString();
            } else {
                resultsDiv.innerHTML = '<div class="error">No stock data received</div>';
                statusSpan.innerHTML = "❌ No data";
            }
        } catch (err) {
            resultsDiv.innerHTML = `<div class="error">Error: ${err.message}</div>`;
            statusSpan.innerHTML = "❌ Error";
        }
        
        fetchBtn.disabled = false;
    }
    
    document.getElementById('fetchBtn').addEventListener('click', fetchStocks);
</script>
</body>
</html>
