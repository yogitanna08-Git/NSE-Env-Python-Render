services:
  - type: web
    name: nifty-envelope-scanner
    runtime: python
    repo: https://github.com/YOUR_USERNAME/nifty-envelope-scanner
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENV_PERCENT
        value: 14
      - key: TOUCH_ZONE
        value: 1
      - key: MA_PERIOD
        value: 200
      - key: REFRESH_INTERVAL
        value: 300
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app